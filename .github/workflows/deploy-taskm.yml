# Publishes the TaskM web app (app/) to https://taskm-school.web.app whenever main changes.
# Needs the repo secret FIREBASE_SERVICE_ACCOUNT (Firebase › Project settings › Service accounts › Generate new private key).
name: Deploy TaskM
on:
  push:
    branches: [main]
    paths: ["app/**", "extension/**", "firebase.json", ".github/workflows/deploy-taskm.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Package the TaskM Chrome button for download (app/chrome.html links to it)
        run: |
          mkdir -p "$RUNNER_TEMP/z/TaskM Chrome" && cp -r extension/. "$RUNNER_TEMP/z/TaskM Chrome/"
          cd "$RUNNER_TEMP/z" && zip -qr "$GITHUB_WORKSPACE/app/taskm-chrome.zip" "TaskM Chrome"
      - name: Stamp the build version in the app footer (date + commit)
        run: |
          V="v$(TZ=America/Los_Angeles date +%Y.%m.%d-%H%M) · ${GITHUB_SHA::7}"
          sed -i -E "s|(id=\"buildVer\">)[^<]*<|\1$V<|" app/app.html
      - name: Skip until the Firebase key is added
        if: env.HAS_KEY != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT secret not set yet; skipping deploy."
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_KEY == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: taskm-sync-d6861
          channelId: live
