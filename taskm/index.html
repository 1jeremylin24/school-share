body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f6f7fb;color:#1d2330;

.lock{width:100%;max-width:360px;background:#fff;border:1px solid #e4e7ef;border-radius:20px;padding:28px 22px 22px;box-shadow:0 10px 30px rgba(40,40,90,.08);text-align:center}

form{text-align:left}.pwrow{position:relative}

.showbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#4f5bd5;font:inherit;font-size:14px;font-weight:600;padding:8px 10px;cursor:pointer}
.rem{display:flex;align-items:center;gap:10px;margin:14px 2px;font-size:15px;cursor:pointer}

.go{width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px;border:0;border-radius:12px;background:#4f5bd5;color:#fff;cursor:pointer}
.go:disabled{opacity:.6}
.err{margin:12px 2px 0;color:#c62828;font-size:14.5px;font-weight:600}
.fine{margin:16px 2px 0;color:#6b7385;font-size:12.5px;text-align:center}
.status{color:#6b7385;font-size:15px;margin:10px 0}

(function(){
var P=JSON.parse(document.getElementById('taskm-payload').textContent);
var DB='taskm-phone',ST='keys',LS='taskm-phone-pass';
var $=function(id){return document.getElementById(id)};
function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
var salt=u8(P.salt),iv=u8(P.iv),ct=u8(P.ct),aad=new TextEncoder().encode(P.aad);
function norm(p){return String(p).trim().toLowerCase().replace(/[\s\-]+/g,'-').replace(/^-+|-+$/g,'')}
function db(){return new Promise(function(res,rej){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){r.result.createObjectStore(ST)};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function tx(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction(ST,mode),q=fn(t.objectStore(ST));
  t.oncomplete=function(){d.close();res(q&&q.result)};t.onerror=t.onabort=function(){d.close();rej(t.error)}})})}
function load(){return tx('readonly',function(s){return s.get('k')})}
function save(v){return tx('readwrite',function(s){s.put(v,'k')})}
function forget(){try{localStorage.removeItem(LS)}catch(e){}return tx('readwrite',function(s){s.clear()}).catch(function(){})}
function baseKey(pass){return crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pass)),'PBKDF2',false,['deriveKey'])}
function aesKey(bk){return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:P.iter},bk,{name:'AES-GCM',length:256},false,['decrypt'])}
function dec(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv,additionalData:aad,tagLength:128},k,ct).then(function(b){return new TextDecoder().decode(b)})}
function show(html){document.open();document.write(html);document.close()}
function ui(on){$('f').hidden=!on;$('status').hidden=on;if(on){try{$('pw').focus()}catch(e){}}}
function err(m){var e=$('err');e.textContent=m;e.hidden=!m}
// Remembered: a non-extractable PBKDF2 key (works with every future build's new salt) plus this build's AES key.
function auto(){
  return load().then(function(r){
    if(!r||!r.base)throw 'none';
    var fresh=function(){return aesKey(r.base).then(function(k){return dec(k).then(function(h){return save({base:r.base,salt:P.salt,aes:k}).catch(function(){}).then(function(){return h})})})};
    return (r.salt===P.salt&&r.aes)?dec(r.aes).catch(fresh):fresh();
  }).catch(function(e){var p=null;try{p=localStorage.getItem(LS)}catch(x){}
    if(!p)throw e;return baseKey(p).then(aesKey).then(dec)});
}
function unlock(pass,remember){
  return baseKey(pass).then(function(bk){return aesKey(bk).then(function(k){return dec(k).then(function(h){
    if(!remember)return forget().then(function(){return h});
    return save({base:bk,salt:P.salt,aes:k}).then(function(){try{localStorage.removeItem(LS)}catch(e){}},
      function(){try{localStorage.setItem(LS,norm(pass))}catch(e){}}).then(function(){return h});
  })})});
}
if(!window.crypto||!crypto.subtle||!window.TextDecoder){ui(true);err('This browser can\u2019t unlock TaskM. Open it in Safari over https.');$('go').disabled=true;return}
$('show').addEventListener('click',function(){var t=$('pw').type==='password';$('pw').type=t?'text':'password';this.textContent=t?'Hide':'Show'});
$('f').addEventListener('submit',function(ev){ev.preventDefault();var p=$('pw').value;
  if(!norm(p)){err('Enter your passcode.');return}
  err('');$('go').disabled=true;$('go').textContent='Unlocking\u2026';
  unlock(p,$('remember').checked).then(show,function(e){$('go').disabled=false;$('go').textContent='Unlock';
    err(e&&e.name==='OperationError'?'That passcode didn\u2019t work. Check the words and try again.':'Couldn\u2019t unlock: '+((e&&e.message)||e));
    try{$('pw').select()}catch(x){}});
});
ui(false);
auto().then(show,function(e){
  if(e&&e!=='none'&&e.name==='OperationError'){forget();err('The saved passcode no longer works. Enter the current one.')}
  ui(true)});
})();
